# 수집·집계 설정
user_agent: "korea-trend-radar/1.0 (personal research; stores keyword counts only; contact via repo)"
timeout_sec: 20
max_workers: 4
host_min_interval_sec: 1.0     # 같은 서버에는 이 간격 이상 두고 요청
retries: 1

max_item_age_hours: 36         # 이보다 오래된 기사는 무시 (정지된 피드의 옛 기사 방지)
stale_feed_hours: 24           # 피드의 최신 기사가 이보다 오래되면 '정지 의심'으로 표시
state_keep_days: 2             # 오늘과 어제 분량만 상태에 보관, 그 이전 날은 확정해 파일로 쓴다

ngram_max: 3                   # 2~3어절 조합까지 추출
max_keywords_per_headline: 80
min_articles_to_store: 1       # 하루 기사 수가 이 값 미만인 키워드는 저장하지 않는다. 1 = 하루 1건 키워드도 저장 (초기 신호 보존)
min_articles_to_display: 2     # 화면·분석에서 보여 주는 기준. 저장 기준과 별개이며 store.read_daily(min_articles=)로 적용
daily_gzip: true               # 일일 집계를 날짜.csv.gz 로 저장 (공개 저장소 용량 절약). 예전 날짜.csv 도 읽을 수 있다

# 완전한 날 판정. 이 기준을 하나라도 어기면 '불완전한 날'로 표시해 기준선과 급증 계산에서 뺀다
expected_runs_per_day: 12
min_runs_per_day: 6
coverage_min: 0.7              # 정상 수집한 피드 비율(평균)
volume_drop_ratio: 0.5         # 최근 완전한 날들의 중앙값 대비 기사 수 비율
baseline_days_required: 21     # 이 일수만큼 완전한 날이 쌓이기 전에는 급증 판정을 하지 않는다

# 자동 별칭 병합
initials_min_articles: 3
initials_min_outlets: 2
