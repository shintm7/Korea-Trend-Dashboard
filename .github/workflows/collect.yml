name: Collect news keywords

on:
  schedule:
    - cron: "17 */2 * * *"      # 2시간마다 (정각 혼잡을 피해 17분)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 상태(헤드라인 원문 없이 해시·키워드만)는 git이 아니라 캐시에 둔다
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Collect
        run: python scripts/collect.py | tee collect.log

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          echo '### 수집 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat collect.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 날이 확정됐을 때만 data/ 가 바뀌므로 하루 한 번 정도만 커밋된다
      - name: Commit finalized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "data: finalize days"; git pull --rebase; git push; }
